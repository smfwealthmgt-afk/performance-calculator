<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SMF Performance Calculator</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{

    background:#eef2f7;
    padding:20px;

}

.container{

    max-width:700px;
    margin:auto;
    background:white;
    border-radius:12px;
    box-shadow:0 10px 25px rgba(0,0,0,.12);
    overflow:hidden;

}

.header{

    background:#005BAC;
    color:white;
    text-align:center;
    padding:25px;

}

.header h1{

    font-size:28px;

}

.section{

    padding:25px;

}

.section h2{

    color:#005BAC;
    margin-bottom:20px;
    border-bottom:2px solid #ddd;
    padding-bottom:8px;

}

label{

    display:block;
    margin-top:15px;
    margin-bottom:6px;
    font-weight:bold;

}

input,
select{

    width:100%;
    padding:12px;
    border:1px solid #ccc;
    border-radius:6px;
    font-size:16px;

}

.month-grid{

    display:grid;
    grid-template-columns:1fr 1fr;
    gap:15px;

}

button{

    width:100%;
    padding:18px;
    background:#005BAC;
    color:white;
    border:none;
    border-radius:8px;
    font-size:18px;
    cursor:pointer;
    margin-top:30px;

}

button:hover{

    background:#004080;

}

#result{

    margin-top:30px;
    background:#F4F8FC;
    border-left:5px solid #005BAC;
    padding:20px;
    border-radius:8px;
    display:none;

}

.footer{

    text-align:center;
    color:#777;
    font-size:13px;
    padding:15px;

}

@media(max-width:600px){

.month-grid{

grid-template-columns:1fr;

}

}

</style>

</head>

<body>

<div class="container">

<div class="header">

<h1>SMF Performance Calculator</h1>

<p>Deposit Performance Assessment Tool</p>

</div>

<div class="section">

<h2>Employee Information</h2>

<label>Job Grade</label>

<select id="grade">

<option>Select Job Grade</option>

<option>TPMO</option>
<option>APMO</option>
<option>PMO</option>
<option>SPMO</option>
<option>AO</option>
<option>Officer</option>
<option>SO</option>
<option>EO</option>

</select>

</div>

<div class="section">

<h2>Performance Input</h2>

<label>New Account Opening</label>

<input type="number" id="ntb">

<label>Month-End CASA Portfolio</label>

<input type="number" id="casa">

<label>FD Volume</label>

<input type="number" id="fd">

<label>DPS Volume</label>

<input type="number" id="dps">

</div>

<div class="section">

<h2>Rolling Average Balance</h2>

<div class="month-grid">

<div>

<label id="m1"></label>

<input type="number" id="bal1">

</div>

<div>

<label id="m2"></label>

<input type="number" id="bal2">

</div>

<div>

<label id="m3"></label>

<input type="number" id="bal3">

</div>

<div>

<label id="m4"></label>

<input type="number" id="bal4">

</div>

</div>

<button onclick="calculate()">

Calculate Performance

</button>

<div id="result">

<h2>Performance Result</h2>

<p>This section will display the calculation in the next step.</p>

</div>

</div>

<div class="footer">

Version 1.0

</div>

</div>

<script>

///////////////////////////////////////////////////////////
// SMF INCENTIVE POLICY
///////////////////////////////////////////////////////////

const POLICY = {

TPMO:{
    ntbTarget:4,
    casaTarget:300000,
    growthTarget:600000,
    fdTarget:1000000,
    dpsTarget:8000,

    ntbWeight:5,
    casaWeight:5,
    growthWeight:50,
    fdWeight:30,
    dpsWeight:10,

    ntbMultiplier:1,
    casaMultiplier:1,
    growthMultiplier:4,
    fdMultiplier:1.5,
    dpsMultiplier:1.5
},

APMO:{
    ntbTarget:4,
    casaTarget:400000,
    growthTarget:800000,
    fdTarget:1300000,
    dpsTarget:10000,

    ntbWeight:5,
    casaWeight:5,
    growthWeight:50,
    fdWeight:30,
    dpsWeight:10,

    ntbMultiplier:1,
    casaMultiplier:1,
    growthMultiplier:4,
    fdMultiplier:1.5,
    dpsMultiplier:1.5
},

PMO:{
    ntbTarget:5,
    casaTarget:400000,
    growthTarget:900000,
    fdTarget:1500000,
    dpsTarget:12000,

    ntbWeight:5,
    casaWeight:5,
    growthWeight:50,
    fdWeight:30,
    dpsWeight:10,

    ntbMultiplier:1,
    casaMultiplier:1,
    growthMultiplier:4,
    fdMultiplier:1.5,
    dpsMultiplier:1.5
},

SPMO:{
    ntbTarget:5,
    casaTarget:400000,
    growthTarget:1100000,
    fdTarget:1700000,
    dpsTarget:14000,

    ntbWeight:5,
    casaWeight:5,
    growthWeight:50,
    fdWeight:30,
    dpsWeight:10,

    ntbMultiplier:1,
    casaMultiplier:1,
    growthMultiplier:4,
    fdMultiplier:1.5,
    dpsMultiplier:1.5
},

AO:{
    ntbTarget:6,
    casaTarget:500000,
    growthTarget:1300000,
    fdTarget:2100000,
    dpsTarget:16000,

    ntbWeight:5,
    casaWeight:5,
    growthWeight:50,
    fdWeight:30,
    dpsWeight:10,

    ntbMultiplier:1,
    casaMultiplier:1,
    growthMultiplier:4,
    fdMultiplier:1.5,
    dpsMultiplier:1.5
},

Officer:{
    ntbTarget:6,
    casaTarget:500000,
    growthTarget:1500000,
    fdTarget:2200000,
    dpsTarget:18000,

    ntbWeight:5,
    casaWeight:5,
    growthWeight:50,
    fdWeight:30,
    dpsWeight:10,

    ntbMultiplier:1,
    casaMultiplier:1,
    growthMultiplier:4,
    fdMultiplier:1.5,
    dpsMultiplier:1.5
},

SO:{
    ntbTarget:7,
    casaTarget:600000,
    growthTarget:1800000,
    fdTarget:2300000,
    dpsTarget:20000,

    ntbWeight:5,
    casaWeight:5,
    growthWeight:50,
    fdWeight:30,
    dpsWeight:10,

    ntbMultiplier:1,
    casaMultiplier:1,
    growthMultiplier:4,
    fdMultiplier:1.5,
    dpsMultiplier:1.5
},

EO:{
    ntbTarget:7,
    casaTarget:600000,
    growthTarget:2100000,
    fdTarget:2500000,
    dpsTarget:20000,

    ntbWeight:5,
    casaWeight:5,
    growthWeight:50,
    fdWeight:30,
    dpsWeight:10,

    ntbMultiplier:1,
    casaMultiplier:1,
    growthMultiplier:4,
    fdMultiplier:1.5,
    dpsMultiplier:1.5
}

};


///////////////////////////////////////////////////////////
// MONTH LIST
///////////////////////////////////////////////////////////

const months=[
"January",
"February",
"March",
"April",
"May",
"June",
"July",
"August",
"September",
"October",
"November",
"December"
];
const today=new Date();

document.getElementById("m1").innerHTML=months[(today.getMonth()+9)%12];
document.getElementById("m2").innerHTML=months[(today.getMonth()+10)%12];
document.getElementById("m3").innerHTML=months[(today.getMonth()+11)%12];
document.getElementById("m4").innerHTML=months[today.getMonth()];

///////////////////////////////////////////////////////////
// CALCULATE PERFORMANCE
///////////////////////////////////////////////////////////

function calculate(){

// Read Job Grade
let grade=document.getElementById("grade").value;

if(grade=="Select Job Grade"){

alert("Please select Job Grade");

return;

}

// Read Targets

let target=POLICY[grade];

// Read User Inputs

let ntb=parseFloat(document.getElementById("ntb").value)||0;

let casa=parseFloat(document.getElementById("casa").value)||0;

let fd=parseFloat(document.getElementById("fd").value)||0;

let dps=parseFloat(document.getElementById("dps").value)||0;

let bal1=parseFloat(document.getElementById("bal1").value)||0;

let bal2=parseFloat(document.getElementById("bal2").value)||0;

let bal3=parseFloat(document.getElementById("bal3").value)||0;

let bal4=parseFloat(document.getElementById("bal4").value)||0;


// NTB Performance

let ntbPerformance=(ntb/target.ntbTarget)*100;


// NTB Marks

let ntbMarks=Math.min(

target.ntbWeight,

(ntbPerformance/100)*target.ntbWeight

);
///////////////////////////////////////////////////////////
// CASA PERFORMANCE
///////////////////////////////////////////////////////////

let casaPerformance = (casa / target.casaTarget) * 100;


let casaMarks = Math.min(

target.casaWeight,

(casaPerformance / 100) * target.casaWeight

);

// Show Result

document.getElementById("result").style.display="block";

document.getElementById("result").innerHTML=`

<h2>Performance Result</h2>

<hr>

<p><b>Job Grade :</b> ${grade}</p>

<br>

<p>NTB Target : ${target.ntbTarget}</p>

<p>NTB Achievement : ${ntb}</p>

<p>NTB Performance : ${ntbPerformance.toFixed(2)}%</p>

<p><b>NTB Marks : ${ntbMarks.toFixed(2)} / ${target.ntbWeight}</b></p>

<br><br>

<p>Month-End CASA Portfolio Target : ${target.casaTarget.toLocaleString()}</p>

<p>Month-End CASA Portfolio Achievement : ${casa.toLocaleString()}</p>

<p>Month-End CASA Portfolio Performance : ${casaPerformance.toFixed(2)}%</p>

<p><b>Month-End CASA Portfolio Marks : ${casaMarks.toFixed(2)} / ${target.casaWeight}</b></p>
`;

}

</script>

</body>
</html>
